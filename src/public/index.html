<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ブラックジャック</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    画面構成（v1 はコンソール再現でよい）:
      - h1: タイトル
      - #setup:  人数セレクト(1-3) + 「ゲーム開始」ボタン
      - #table:  参加者ごとの手札と得点（view().participants を描画）
                 ・ディーラーの伏せカードは "?" のまま出す
                 ・FINISHED では results をハイライト表示
      - #actions: 「引く(Hit)」「引かない(Stand)」ボタン
                  ・自分の手番(view().currentPlayer === 'あなた' かつ phase === 'PLAYER_TURN')以外は disabled
      - #log:    <pre> に view().log を join("\n") で流し込む（要件.md のコンソール例と一致するはず）
  -->
  <main>
    <h1>ブラックジャック</h1>

    <p id="error" role="alert" hidden></p>

    <section id="setup">
      <label>プレイヤー人数
        <select id="player-count">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>
      <button id="start">ゲーム開始</button>
    </section>

    <section id="table" hidden>
      <!-- app.js が participants を元に動的生成する -->
    </section>

    <section id="actions" hidden>
      <button id="hit">引く（Hit）</button>
      <button id="stand">引かない（Stand）</button>
    </section>

    <section id="result" hidden>
      <div id="result-body"><!-- app.js が勝敗を入れる --></div>
      <button id="restart">もう一度</button>
    </section>

    <section id="log-area">
      <h2>ログ</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
